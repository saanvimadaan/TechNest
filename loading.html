<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNest — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="loader-body">

  <div class="loader-wrap">
    <span class="eyebrow">PREPARING YOUR NEST</span>

    <div class="loader-logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M5 15 L16 5 L27 15" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 13 V27 H23 V13" stroke="#35d0dd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="21" r="3" fill="#ff7a7a"/>
      </svg>
      Tech<span>Nest</span>
    </div>

    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="bar-pct" id="barPct">0%</div>

    <p class="loader-msg" id="loaderMsg">On loading, the website will open — hang tight...</p>
  </div>

<script>
  const messages = [
    "On loading, the website will open — hang tight...",
    "Curating today's smart electronics...",
    "Almost there — welcome to TechNest..."
  ];
  const msgEl = document.getElementById('loaderMsg');
  const fillEl = document.getElementById('barFill');
  const pctEl = document.getElementById('barPct');

  const duration = 3000; // 3 seconds
  const start = performance.now();

  function frame(now){
    const elapsed = now - start;
    const progress = Math.min(1, elapsed / duration);
    const pct = Math.round(progress * 100);

    fillEl.style.width = pct + '%';
    pctEl.textContent = pct + '%';

    const msgIndex = Math.min(messages.length - 1, Math.floor(progress * messages.length));
    msgEl.textContent = messages[msgIndex];

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      window.location.href = 'index.html';
    }
  }

  requestAnimationFrame(frame);
</script>

</body>
</html>
